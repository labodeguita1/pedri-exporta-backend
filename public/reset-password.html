<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #eef2fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(201,24,74,.10);
    }
    .logo { text-align: center; font-size: 2.5rem; margin-bottom: 8px; }
    h1 { text-align: center; font-size: 1.25rem; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
    .sub { text-align: center; font-size: .85rem; color: #888; margin-bottom: 28px; }
    label { display: block; font-size: .78rem; font-weight: 600; color: #555; margin-bottom: 5px; letter-spacing: .04em; text-transform: uppercase; }
    input {
      width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0;
      border-radius: 10px; font-family: inherit; font-size: .95rem;
      outline: none; transition: border .2s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #cf142b; }
    .btn {
      width: 100%; padding: 13px; background: #cf142b; color: #fff;
      border: none; border-radius: 10px; font-family: inherit;
      font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s;
    }
    .btn:hover { background: #9c0f20; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .error {
      background: #eef2fb; border: 1.5px solid #d6e0f5;
      border-radius: 8px; padding: 10px 14px;
      color: #cf142b; font-size: .85rem; margin-bottom: 16px; display: none;
    }
    .success {
      text-align: center; display: none;
    }
    .success .icon { font-size: 3rem; margin-bottom: 12px; }
    .success h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; color: #1a1a2e; }
    .success p { font-size: .88rem; color: #666; margin-bottom: 20px; }
    .link { text-align: center; margin-top: 18px; font-size: .85rem; color: #888; }
    .link a { color: #cf142b; text-decoration: none; font-weight: 600; }
    .expired { text-align: center; }
    .expired .icon { font-size: 3rem; margin-bottom: 12px; }
    .expired h2 { font-size: 1.1rem; font-weight: 700; color: #cf142b; margin-bottom: 8px; }
    .expired p { font-size: .88rem; color: #666; margin-bottom: 20px; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo" id="store-logo">⚡</div>
  <h1>Nueva contraseña</h1>
  <p class="sub">Elige una contraseña segura para tu cuenta</p>

  <!-- Estado: token inválido -->
  <div id="state-expired" class="expired" style="display:none">
    <div class="icon">⏰</div>
    <h2>Enlace expirado</h2>
    <p>Este enlace ya no es válido. Solicita uno nuevo desde la tienda.</p>
    <a href="/tienda.html" class="btn" style="display:inline-block;text-decoration:none;text-align:center">Volver a la tienda</a>
  </div>

  <!-- Formulario -->
  <div id="state-form">
    <div class="error" id="form-error"></div>
    <label>Nueva contraseña *</label>
    <input type="password" id="pw" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
    <label>Confirmar contraseña *</label>
    <input type="password" id="pw2" placeholder="Repite la contraseña" autocomplete="new-password">
    <button class="btn" id="btn-reset">Guardar contraseña</button>
    <div class="link"><a href="/tienda.html">← Volver a la tienda</a></div>
  </div>

  <!-- Éxito -->
  <div id="state-success" class="success">
    <div class="icon">✅</div>
    <h2>¡Contraseña actualizada!</h2>
    <p>Ya puedes iniciar sesión con tu nueva contraseña.</p>
    <a href="/tienda.html" class="btn" style="display:inline-block;text-decoration:none;text-align:center">Ir a la tienda</a>
  </div>
</div>

<script>
const API = '/api';

// Leer token de la URL
const params = new URLSearchParams(window.location.search);
const TOKEN  = params.get('token');

if (!TOKEN) {
  document.getElementById('state-form').style.display    = 'none';
  document.getElementById('state-expired').style.display = 'block';
}

// Cargar logo de la tienda
fetch(API + '/settings').then(r => r.json()).then(s => {
  if (s.logo_emoji) document.getElementById('store-logo').textContent = s.logo_emoji;
}).catch(() => {});

document.getElementById('btn-reset').addEventListener('click', async () => {
  const pw    = document.getElementById('pw').value;
  const pw2   = document.getElementById('pw2').value;
  const errEl = document.getElementById('form-error');
  errEl.style.display = 'none';

  if (pw.length < 8)         return showError('La contraseña debe tener al menos 8 caracteres');
  if (!/[A-Z]/.test(pw))     return showError('Debe tener al menos una letra mayúscula');
  if (!/[0-9]/.test(pw))     return showError('Debe tener al menos un número');
  if (pw !== pw2)             return showError('Las contraseñas no coinciden');

  const btn = document.getElementById('btn-reset');
  btn.disabled = true; btn.textContent = 'Guardando…';

  try {
    const res  = await fetch(API + '/users/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, password: pw })
    });
    const data = await res.json();
    if (!res.ok) {
      if (res.status === 400 && data.error.includes('válido')) {
        document.getElementById('state-form').style.display    = 'none';
        document.getElementById('state-expired').style.display = 'block';
        return;
      }
      throw new Error(data.error);
    }
    document.getElementById('state-form').style.display   = 'none';
    document.getElementById('state-success').style.display = 'block';
  } catch(e) {
    showError(e.message);
    btn.disabled = false; btn.textContent = 'Guardar contraseña';
  }
});

function showError(msg) {
  const el = document.getElementById('form-error');
  el.textContent = msg;
  el.style.display = 'block';
}
</script>
</body>
</html>
